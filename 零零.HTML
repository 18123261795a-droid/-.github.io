<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>❤️ 我爱你 · 趣味版</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --heart-main: #ff4d6d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Serif SC', 'STSong', serif;
            overflow: hidden;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- 背景星星（带视差移动容器） ---------- */
        .stars {
            position: fixed;
            top: -20px;
            left: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            pointer-events: none;
            z-index: 0;
            transition: transform 0.1s ease-out;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.15;
                transform: scale(0.7);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.4);
            }
        }

        /* ---------- 光晕（也会轻微跟随鼠标） ---------- */
        .glow-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(250px, 50vw, 450px);
            height: clamp(250px, 50vw, 450px);
            border-radius: 50%;
            background: radial-gradient(circle,
                    rgba(255, 77, 109, 0.15) 0%,
                    rgba(255, 100, 140, 0.05) 35%,
                    transparent 70%);
            animation: ringPulse 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
            transition: transform 0.2s ease-out;
        }

        .glow-ring-2 {
            animation-delay: 1.5s;
            width: clamp(300px, 60vw, 550px);
            height: clamp(300px, 60vw, 550px);
            background: radial-gradient(circle,
                    rgba(255, 140, 170, 0.08) 0%,
                    rgba(255, 120, 150, 0.03) 40%,
                    transparent 70%);
        }

        @keyframes ringPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 1;
            }
        }

        /* ---------- 主容器 ---------- */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        /* ---------- 爱心图标（可连击触发彩蛋） ---------- */
        .heart-icon {
            font-size: clamp(42px, 8vw, 72px);
            animation: heartBeat 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 75, 110, 0.7));
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 11;
        }
        .heart-icon:hover {
            transform: scale(1.15);
        }
        .heart-icon:active {
            transform: scale(0.9);
        }

        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.25);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.2);
            }
            60% {
                transform: scale(1);
            }
        }

        /* ---------- “我爱你”文字 ---------- */
        .love-text {
            font-size: clamp(50px, 12vw, 100px);
            font-weight: 900;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg,
                    #ff6b8a 0%, #ff4d6d 20%, #ff758f 40%,
                    #ffb3c6 60%, #ff4d6d 80%, #ff6b8a 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: gradientShift 4s ease-in-out infinite,
                textGlow 2s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(255, 77, 109, 0.6));
            cursor: pointer;
            transition: transform 0.2s;
            line-height: 1.2;
            text-align: center;
        }
        .love-text:active {
            transform: scale(0.95);
        }

        /* 文字点击爆发时的放大动画 */
        .love-text.pop {
            animation: popText 0.5s ease-out;
        }
        @keyframes popText {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }
        @keyframes textGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 25px rgba(255, 77, 109, 0.6));
            }
            50% {
                filter: drop-shadow(0 0 50px rgba(255, 100, 130, 0.95));
            }
        }

        /* ---------- 副标题 ---------- */
        .subtitle {
            font-size: clamp(16px, 3vw, 24px);
            color: rgba(255, 180, 200, 0.85);
            letter-spacing: 0.15em;
            animation: fadeInUp 2s ease-out 0.6s both;
            text-align: center;
            font-weight: 300;
            pointer-events: none;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- 浮动爱心粒子（从底部升起） ---------- */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .floating-heart {
            position: absolute;
            font-size: var(--size);
            bottom: -60px;
            animation: floatUp var(--float-duration) ease-in forwards;
            animation-delay: var(--float-delay);
            opacity: 0;
            color: var(--heart-color);
            filter: blur(0.5px);
        }
        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(0) translateX(0) scale(0.3) rotate(0deg);
            }
            10% {
                opacity: 0.9;
            }
            30% {
                opacity: 0.8;
            }
            70% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translateY(-110vh) translateX(var(--drift)) scale(1.3) rotate(var(--rotation));
            }
        }

        /* ---------- 鼠标跟随爱心粒子 ---------- */
        .mouse-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        .mouse-heart {
            position: absolute;
            font-size: 18px;
            animation: mouseHeartFade 0.8s ease-out forwards;
            pointer-events: none;
            color: var(--heart-color);
        }
        @keyframes mouseHeartFade {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.6);
            }
            100% {
                opacity: 0;
                transform: translate(var(--mx), var(--my)) scale(1.2);
            }
        }

        /* ---------- 爆裂爱心（点击“我爱你”时触发） ---------- */
        .burst-heart {
            position: absolute;
            font-size: 22px;
            animation: burst 0.9s ease-out forwards;
            pointer-events: none;
            color: var(--heart-color);
        }
        @keyframes burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translate(var(--bx), var(--by)) scale(0.2);
            }
        }

        /* ---------- 飘浮情话（从右向左滑动） ---------- */
        .phrase-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 6;
        }
        .phrase {
            position: absolute;
            font-size: clamp(20px, 4vw, 36px);
            font-weight: bold;
            color: rgba(255, 220, 230, 0.8);
            text-shadow: 0 0 20px rgba(255, 80, 120, 0.7);
            white-space: nowrap;
            animation: phraseSlide var(--slide-duration) linear forwards;
            top: var(--top);
        }
        @keyframes phraseSlide {
            0% {
                transform: translateX(110vw);
                opacity: 0;
            }
            8% {
                opacity: 0.9;
            }
            85% {
                opacity: 0.8;
            }
            100% {
                transform: translateX(-30vw);
                opacity: 0;
            }
        }

        /* ---------- 隐藏彩蛋纸条 ---------- */
        .secret-note {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 245, 250, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 30px 36px;
            box-shadow: 0 20px 60px rgba(255, 70, 100, 0.5), 0 0 80px rgba(255, 150, 180, 0.6);
            z-index: 100;
            text-align: center;
            color: #b13e4b;
            font-size: clamp(20px, 5vw, 32px);
            font-weight: bold;
            pointer-events: auto;
            animation: notePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: none;
            max-width: 90vw;
            line-height: 1.5;
        }
        .secret-note.show {
            display: block;
            animation: notePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .secret-note .close-note {
            display: inline-block;
            margin-top: 22px;
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
        .secret-note .close-note:hover {
            background: #e63e5a;
        }

        @keyframes notePop {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-20deg);
                opacity: 0;
            }
            70% {
                transform: translate(-50%, -50%) scale(1.08) rotate(2deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .main-container {
                gap: 12px;
            }
            .love-text {
                letter-spacing: 0.04em;
            }
        }
    </style>
</head>
<body>

    <!-- 背景星星（会随鼠标轻微移动） -->
    <div class="stars" id="stars"></div>

    <!-- 光晕 -->
    <div class="glow-ring" id="glowRing1"></div>
    <div class="glow-ring glow-ring-2" id="glowRing2"></div>

    <!-- 鼠标跟随爱心 -->
    <div class="mouse-hearts" id="mouseHearts"></div>

    <!-- 浮动爱心粒子 -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- 飘浮情话 -->
    <div class="phrase-container" id="phraseContainer"></div>

    <!-- 主体内容 -->
    <div class="main-container">
        <div class="heart-icon" id="heartIcon">💖</div>
        <h1 class="love-text" id="loveText">我 爱 你</h1>
        <p class="subtitle">— 你是世间最美好的存在 —</p>
    </div>

    <!-- 隐藏彩蛋纸条 -->
    <div class="secret-note" id="secretNote">
        ✨ 你是我最珍贵的宝藏 ✨<br>
        <span style="font-size:0.8em;">— 遇见你，三生有幸 —</span>
        <br>
        <button class="close-note" id="closeNote">💖 知道啦</button>
    </div>

    <script>
        // ==================== 工具函数 ====================
        // 轻触感振动（移动端）
        function vibrate(ms = 15) {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(ms);
            }
        }

        // 简短提示音（需要用户交互触发）
        function playBeep(freq = 600, duration = 0.08) {
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration);
            } catch (e) { /* 静默处理 */ }
        }

        // ==================== 背景星星生成 ====================
        const starsContainer = document.getElementById('stars');
        const starCount = 130;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.setProperty('--delay', (Math.random() * 5) + 's');
            starsContainer.appendChild(star);
        }

        // ==================== 星星与光晕视差（随鼠标/触摸移动） ====================
        let mouseX = 0.5,
            mouseY = 0.5; // 默认居中
        function updateParallax(clientX, clientY) {
            mouseX = clientX / window.innerWidth;
            mouseY = clientY / window.innerHeight;
            const moveX = (mouseX - 0.5) * 18;
            const moveY = (mouseY - 0.5) * 18;
            starsContainer.style.transform = `translate(${moveX}px, ${moveY}px)`;

            const ring1 = document.getElementById('glowRing1');
            const ring2 = document.getElementById('glowRing2');
            const ringMoveX = (mouseX - 0.5) * 30;
            const ringMoveY = (mouseY - 0.5) * 30;
            ring1.style.transform = `translate(calc(-50% + ${ringMoveX}px), calc(-50% + ${ringMoveY}px))`;
            ring2.style.transform = `translate(calc(-50% + ${ringMoveX * 0.8}px), calc(-50% + ${ringMoveY * 0.8}px))`;
        }

        window.addEventListener('mousemove', (e) => {
            updateParallax(e.clientX, e.clientY);
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updateParallax(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
        // 触摸结束缓慢回中
        window.addEventListener('touchend', () => {
            mouseX = 0.5;
            mouseY = 0.5;
            starsContainer.style.transform = 'translate(0px, 0px)';
            document.getElementById('glowRing1').style.transform = 'translate(-50%, -50%)';
            document.getElementById('glowRing2').style.transform = 'translate(-50%, -50%)';
        });

        // ==================== 鼠标跟随爱心粒子 ====================
        const mouseHeartsContainer = document.getElementById('mouseHearts');
        const heartEmojis = ['❤️', '💕', '💗', '💖', '💘', '💝', '💞', '🩷', '💓', '♥️'];
        const heartColors = ['#ff4d6d', '#ff6b8a', '#ff8599', '#ffb3c6', '#ff3366', '#ff5e7a', '#ff8fa3', '#e8556d'];

        let lastMouseMoveTime = 0;
        const MOUSE_THROTTLE = 45; // 毫秒节流

        function spawnMouseHeart(x, y) {
            const heart = document.createElement('span');
            heart.classList.add('mouse-heart');
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.style.setProperty('--heart-color', heartColors[Math.floor(Math.random() * heartColors.length)]);
            // 随机飘移方向
            const angle = Math.random() * Math.PI * 2;
            const distance = 30 + Math.random() * 40;
            heart.style.setProperty('--mx', Math.cos(angle) * distance + 'px');
            heart.style.setProperty('--my', Math.sin(angle) * distance - 25 + 'px');
            mouseHeartsContainer.appendChild(heart);
            setTimeout(() => {
                if (heart.parentNode) heart.remove();
            }, 850);
        }

        document.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMouseMoveTime > MOUSE_THROTTLE) {
                spawnMouseHeart(e.clientX, e.clientY);
                lastMouseMoveTime = now;
            }
        });
        // 移动端触摸也产生跟随爱心
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const now = Date.now();
                if (now - lastMouseMoveTime > MOUSE_THROTTLE) {
                    spawnMouseHeart(e.touches[0].clientX, e.touches[0].clientY);
                    lastMouseMoveTime = now;
                }
            }
        }, { passive: true });

        // ==================== 底部升起爱心 ====================
        const floatingHeartsContainer = document.getElementById('floatingHearts');

        function createFloatingHeart() {
            const heart = document.createElement('span');
            heart.classList.add('floating-heart');
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 95 + '%';
            heart.style.setProperty('--size', (Math.random() * 28 + 16) + 'px');
            heart.style.setProperty('--float-duration', (Math.random() * 6 + 7) + 's');
            heart.style.setProperty('--float-delay', (Math.random() * 2.5) + 's');
            heart.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
            heart.style.setProperty('--rotation', (Math.random() * 360 - 180) + 'deg');
            heart.style.setProperty('--heart-color', heartColors[Math.floor(Math.random() * heartColors.length)]);
            floatingHeartsContainer.appendChild(heart);

            const duration = parseFloat(heart.style.getPropertyValue('--float-duration')) * 1000;
            const delay = parseFloat(heart.style.getPropertyValue('--float-delay')) * 1000;
            setTimeout(() => {
                if (heart.parentNode) heart.remove();
            }, duration + delay + 500);
        }

        for (let i = 0; i < 7; i++) {
            setTimeout(() => createFloatingHeart(), i * 450);
        }
        setInterval(createFloatingHeart, 1800);

        // ==================== 点击“我爱你”文字 → 爱心爆炸 ====================
        const loveText = document.getElementById('loveText');

        function createBurst(x, y) {
            const count = 22;
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('span');
                heart.classList.add('burst-heart');
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                heart.style.setProperty('--heart-color', heartColors[Math.floor(Math.random() * heartColors.length)]);
                const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
                const distance = 50 + Math.random() * 90;
                heart.style.setProperty('--bx', Math.cos(angle) * distance + 'px');
                heart.style.setProperty('--by', Math.sin(angle) * distance + 'px');
                document.body.appendChild(heart);
                setTimeout(() => {
                    if (heart.parentNode) heart.remove();
                }, 950);
            }
        }

        loveText.addEventListener('click', (e) => {
            e.stopPropagation();
            // 文字弹跳动画
            loveText.classList.add('pop');
            setTimeout(() => loveText.classList.remove('pop'), 500);
            // 爆发爱心
            createBurst(e.clientX, e.clientY);
            vibrate(20);
            playBeep(800, 0.1);
        });

        // 移动端触摸文字同样效果
        loveText.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            const touch = e.touches[0];
            loveText.classList.add('pop');
            setTimeout(() => loveText.classList.remove('pop'), 500);
            createBurst(touch.clientX, touch.clientY);
            vibrate(20);
            playBeep(800, 0.1);
        }, { passive: true });

        // 避免与文字点击重复触发太多，可以判断目标
            if (e.target === loveText || e.target.closest('.heart-icon') || e.target.closest('.secret-note'))
                return;
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('span');
                heart.classList.add('floating-heart');
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = (e.clientX / window.innerWidth * 100) + '%';
                heart.style.bottom = (100 - e.clientY / window.innerHeight * 100) + '%';
                heart.style.setProperty('--size', (Math.random() * 24 + 14) + 'px');
                heart.style.setProperty('--float-duration', (Math.random() * 4 + 5) + 's');
                heart.style.setProperty('--float-delay', (i * 0.15) + 's');
                heart.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
                heart.style.setProperty('--rotation', (Math.random() * 360 - 180) + 'deg');
                heart.style.setProperty('--heart-color', heartColors[Math.floor(Math.random() * heartColors.length)]);
                floatingHeartsContainer.appendChild(heart);
                const duration = parseFloat(heart.style.getPropertyValue('--float-duration')) * 1000;
                const delay = parseFloat(heart.style.getPropertyValue('--float-delay')) * 1000;
                setTimeout(() => {
                    if (heart.parentNode) heart.remove();
                }, duration + delay + 500);
            }
            vibrate(10);
        });

        // ==================== 飘浮情话 ====================
        const phraseContainer = document.getElementById('phraseContainer');
        const sweetPhrases = [
            '一生一世', '心心相印', '你是我生命里的光',
            '每天爱你多一点', '执子之手', '与你共度余生',
            '你是最美的意外', '我的眼里只有你', '爱你一万年',
            '星河滚烫，你是人间理想', '愿得一心人', '此生不换'
        ];

        function spawnPhrase() {
            const phrase = document.createElement('div');
            phrase.classList.add('phrase');
            phrase.textContent = sweetPhrases[Math.floor(Math.random() * sweetPhrases.length)];
            phrase.style.setProperty('--top', (Math.random() * 75 + 10) + '%');
            phrase.style.setProperty('--slide-duration', (Math.random() * 10 + 14) + 's');
            phraseContainer.appendChild(phrase);
            const duration = parseFloat(phrase.style.getPropertyValue('--slide-duration')) * 1000;
            setTimeout(() => {
                if (phrase.parentNode) phrase.remove();
            }, duration + 600);
        }

        setInterval(spawnPhrase, 4500);
        setTimeout(spawnPhrase, 2000); // 初始快一点出现

        // ==================== 爱心图标连击彩蛋 ====================
        const heartIcon = document.getElementById('heartIcon');
        const secretNote = document.getElementById('secretNote');
        const closeNoteBtn = document.getElementById('closeNote');
        let tapCount = 0;
        let tapTimer = null;
        const TAP_RESET_TIME = 900; // 0.9秒内连击3次

        heartIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            tapCount++;
            vibrate(15);
            playBeep(500, 0.06);
            if (tapCount === 1) {
                tapTimer = setTimeout(() => { tapCount = 0; }, TAP_RESET_TIME);
            }
            if (tapCount >= 3) {
                clearTimeout(tapTimer);
                tapCount = 0;
                showSecretNote();
            }
        });

        function showSecretNote() {
            secretNote.classList.add('show');
            vibrate([30, 50, 30]);
            playBeep(1000, 0.15);
            // 纸条出现时也撒一点爱心
            const rect = secretNote.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            createBurst(cx, cy);
        }

        closeNoteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            secretNote.classList.remove('show');
            vibrate(10);
        });
        secretNote.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // 点击纸条外部也可关闭
        document.addEventListener('click', (e) => {
            if (secretNote.classList.contains('show') && !secretNote.contains(e.target) && e.target !== heartIcon) {
                secretNote.classList.remove('show');
            }
        });

        // ==================== 初始化完毕 ====================
        console.log('💖 趣味表白页面已启动！试试点击文字、连击爱心图标吧~');
    </script>
